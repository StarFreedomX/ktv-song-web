services:
    # 后端服务
    karalive-backend:
        build:
            context: .
            dockerfile: backend/Dockerfile # 指向后端的 Dockerfile 路径
        image: ghcr.io/starfreedomx/karalive-backend:latest
        container_name: karalive-backend
        restart: always
        ports:
            - "5823:5823"
        environment:
            PORT: 5823
            HOST: 0.0.0.0
            REDIS_URL: redis://redis:6379
            DEBUG_MODE: info
            CACHE_DATA_EXPIRE_TIME: 24h
            CACHE_OP_EXPIRE_TIME: 5m
            SEARCH_CACHE_EXPIRE_TIME: 24h #用户单次搜索结果的缓存过期时间，过期后再次搜索会重新计算
            SEARCH_CATALOG_EXPIRE_TIME: 14d #对于匹配到的歌曲的缓存过期时间，过期后再次搜索会重新计算
            IMAGE_CACHE_EXPIRE_TIME: 24h
            ROOM_ARCHIVE_DB_PATH: /app/data/rooms.db #房间存档 SQLite 文件路径
        depends_on:
            - redis
        volumes:
            - ktv_room_archive:/app/data

    # 前端服务
    karalive-frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile # 指向前端的 Dockerfile 路径
        image: ghcr.io/starfreedomx/karalive-frontend:latest
        container_name: karalive-frontend
        restart: always
        ports:
            - "5526:5526"
        environment:
            BACKEND_URL: http://karalive-backend:5823
            HOST: 0.0.0.0
            PORT: 5526
        depends_on:
            - karalive-backend

    # Redis 数据库
    redis:
        image: redis:alpine
        container_name: karalive-redis
        restart: always
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data

volumes:
    redis_data:
    ktv_room_archive:

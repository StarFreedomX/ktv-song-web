name: Docker Release

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    docker-build-push:
        runs-on: ubuntu-latest
        env:
            # 仅 v* tag 才发布；push 到 master 和手动触发都只构建
            IS_PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   component: backend
                        image_name: ktv-song-web-backend
                    -   component: frontend
                        image_name: ktv-song-web-frontend
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Login to GitHub Container Registry
                if: ${{ env.IS_PUBLISH }}
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract Metadata
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
                    tags: |
                        type=ref,event=branch
                        # 正式 tag：v0.7.0 → 0.7.0；
                        # 预发布tag：v0.7.0-alpha → 0.7.0-alpha
                        # 开发 tag（规范 vA.B.C-dev...）：v0.7.0-dev.starfx.01 → 0.7.0-dev.starfx.01（{{version}} 原样保留 pre-release）
                        type=semver,pattern={{version}}
                        # latest 只给无 - 的干净正式 tag（如 v0.7.0），alpha/dev 都不占
                        type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

            -   name: Build and Push Docker Image
                uses: docker/build-push-action@v7
                with:
                    context: .
                    # 指定各自文件夹下的 Dockerfile
                    file: ./${{ matrix.component }}/Dockerfile
                    push: ${{ env.IS_PUBLISH }}
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    # 使用 GitHub Actions 缓存加速构建
                    cache-from: type=gha,scope=${{ matrix.component }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.component }}
